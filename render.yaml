services:
  - type: web
    name: quickpulse-emergency-response
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: GOOGLE_CLIENT_ID
        value: 536396294111-ertaqgvaiuanjsvq1qigfnu0fkt6jcfj.apps.googleusercontent.com
      - key: GOOGLE_MAPS_API_KEY
        value: AIzaSyBijJ9YO2CWTzoILLnyJFrciI6Bie4PDYc
